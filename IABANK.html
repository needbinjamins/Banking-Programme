<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Account Login</title>
<script src="IABANK.js"></script>
<style>
  :root {
    --bg: #e4ebe5;
    --panel: #f7f9f6;
    --ink: #17352f;
    --muted: #5b7068;
    --brass: #a87a1f;
    --line: #c3d0c8;
    --bad: #9b2c2c;
    --good: #1f6b4a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main {
    width: 100%;
    max-width: 420px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-top: 6px solid var(--brass);
    border-radius: 4px;
    padding: 32px 28px 28px;
  }
  h1 {
    margin: 0 0 6px;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 2rem;
    line-height: 1.15;
    font-weight: 700;
  }
  p.sub { margin: 0 0 24px; color: var(--muted); }
  label { display: block; margin: 16px 0 6px; font-weight: 600; font-size: .95rem; }
  input {
    width: 100%;
    padding: 11px 12px;
    font: inherit;
    color: var(--ink);
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 3px;
  }
  input:focus-visible, button:focus-visible {
    outline: 3px solid var(--brass);
    outline-offset: 2px;
  }
  .row { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
  button {
    flex: 1 1 140px;
    padding: 11px 14px;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
    color: #fff;
    background: var(--ink);
    border: 1px solid var(--ink);
    border-radius: 3px;
  }
  button:hover { background: #0f2622; }
  button.alt { color: var(--ink); background: transparent; }
  button.alt:hover { background: #e9efea; }
  .msg { margin-top: 18px; padding: 10px 12px; border-left: 4px solid var(--muted); background: #eef2ee; }
  .msg.bad { border-color: var(--bad); color: var(--bad); }
  .msg.good { border-color: var(--good); color: var(--good); }
  .hidden { display: none; }
  .balance { font-family: Georgia, serif; font-size: 1.6rem; margin: 6px 0 0; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main>
  <h1 id="greeting">Hello</h1>
  <p class="sub" id="sub">Enter your name to get started.</p>

  <!-- Step 1: name -->
  <section id="stepName">
    <label for="name">Your name</label>
    <input id="name" type="text" autocomplete="name">
    <div class="row"><button id="btnName">Continue</button></div>
  </section>

  <!-- Step 2: choice -->
  <section id="stepChoice" class="hidden">
    <div class="row">
      <button id="btnCreate">Create account</button>
      <button id="btnLogin" class="alt">Log in</button>
    </div>
  </section>

  <!-- Step 3: create account -->
  <section id="stepCreate" class="hidden">
    <label for="newUser">Choose a username</label>
    <input id="newUser" type="text" autocomplete="username">
    <label for="newPass">Choose a password</label>
    <input id="newPass" type="password" autocomplete="new-password">
    <div class="row"><button id="btnSave">Create account</button></div>
  </section>

  <!-- Step 4: log in -->
  <section id="stepLogin" class="hidden">
    <label for="user">Username</label>
    <input id="user" type="text" autocomplete="username">
    <label for="pass">Password</label>
    <input id="pass" type="password" autocomplete="current-password">
    <div class="row"><button id="btnSubmit">Log in</button></div>
  </section>

  <!-- Step 5: forgot password -->
  <section id="stepForgot" class="hidden">
    <div class="row">
      <button id="btnForgotYes">Forgot password</button>
      <button id="btnForgotNo" class="alt">Try again</button>
    </div>
  </section>

  <!-- Step 6: welcome / balance -->
  <section id="stepWelcome" class="hidden">
    <label for="balanceInput">Account balance</label>
    <input id="balanceInput" type="number" step="0.01" value="0">
    <p class="balance" id="balanceShow">$0.00</p>
    <p class="linkExternalAccount">Transfer to/from external account(s)</p>
    <p class="payBills">Scheduled Payments</p>
    <p class="depositCheck">Deposit</p>
    <p class="spendingStatements">View Statements</p>
  </section>

  <div id="msg" class="msg hidden" role="status" aria-live="polite"></div>
</main>

</body>
</html>
